<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#70556f">
<title>Offline · Variaq</title>
<style>
  :root { --bg: #f8f6f3; --text: #29242d; --muted: #6b6370; --accent: #70556f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #211d24; --text: #f7f2ee; --muted: #c2b8c0; --accent: #c7a9c1; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 16px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; box-sizing: border-box; }
  .box { max-width: 420px; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { font: 400 28px Georgia, serif; margin: 18px 0 8px; }
  p { color: var(--muted); }
  button { margin-top: 12px; padding: 12px 22px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: 600 15px inherit; cursor: pointer; }
</style>
</head>
<body>
  <div class="box">
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Variaq needs an internet connection to load your company's data. For security, financial data isn't stored on this device.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
